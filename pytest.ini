[pytest]
# The self-contained tier and nothing else.  Collecting a suite means
# importing it, and a suite from any other tier builds a client on the way
# up -- so a bare `pytest` at the repository root must not be able to find
# one.  `tests/conftest.py` refuses them a second time, by directory.
testpaths = tests/stub

# Nothing here matches a suite's name, deliberately.  The suites are
# collected by `tests/conftest.py`, which reads each one's PARTS; leaving
# pytest's own Python collector matching them as well would import every
# suite a second time -- running its module body twice -- to look for
# `test_` functions that do not exist.
python_files = _collected_by_conftest_*.py

# The suites report themselves, line by line, and the runner reads those
# lines.  Capturing them would leave it nothing to read.
#
# The cache is left on: it is what remembers which parts failed, and
# re-running only those is half the point of collecting parts at all.
addopts = -q
