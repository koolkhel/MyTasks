schema: spec-driven

context: |
    Tech stack: Python, venv, Textual for UI
    We use conventional commits
    Domain: todo app

    The board draws rows from several sources. A row from
    a source carries a marker, is drawn and counted like any other row, and
    refuses the writes that would change it.

    Tests live in `tests/`, one directory per tier: `stub` needs nothing
    beyond the repository, `config` reads the board's own `.env`, `store`
    talks to the task store, `tracker` to the issue tracker, `gateway` moves
    a real message on a real mail account, and `probes` holds files that
    assert nothing and are never run. The directory is a suite's whole
    declaration of what it needs. `python tests/run.py` runs the
    self-contained tier and needs no credentials; the others are asked for
    explicitly, refuse to start when what they need is not configured, and
    the ones sharing the store's quota are paced apart. `--all` runs every
    tier this machine can, naming the ones it skips.

    The account has two tokens. SINGULARITY_TOKEN is the board's;
    SINGULARITY_TEST_TOKEN is the suites', and every suite that talks to the
    store adopts it before building a client. Both live in the gitignored
    `.env`.

# Per-artifact rules (optional)
rules:
    tasks:
        - >-
            A verification task must name its instrument -- which suite, and
            whether it runs against a stub or the live account -- and say what
            would count as passing.  "Verify it works" cannot be checked off
            honestly.
        - >-
            Keep verification against a stub separate from verification
            against the live account.  The two fail for different reasons and
            are re-run differently.
        - >-
            Where a task reads a fixture the code under test can now write to,
            say that the fixture is copied per run.
        - >-
            A task that runs a suite against the task store says it uses the
            suites' token rather than the board's, so that checking it off
            means the quota spent was the right one.

# Per-operation guidance (optional)
operations:
    apply:
        guidance:
            - >-
                Do not run every suite back to back.  The task store answers
                HTTP 429 ThrottlerException under that load and stays
                throttled for tens of minutes, after which every live suite
                fails for a reason that has nothing to do with the change.
                Run the stubbed suites as a batch; pace the live ones about
                25 seconds apart.
            - >-
                A suite that talks to the task store uses the account's second
                token, never the board's.  `.env` holds SINGULARITY_TEST_TOKEN
                beside SINGULARITY_TOKEN; a suite sets the former as its own
                SINGULARITY_TOKEN before it builds a client, and the runner
                also hands it to every suite it launches.  A full run can spend
                the quota, and when it does it must be the suites' quota gone,
                not the one the board being worked in depends on.
            - >-
                Make that hold for a suite run on its own, not only through the
                runner: narrowing a failure down means running one suite
                directly, and that is exactly when reaching for the board's
                token would go unnoticed.  Prove it by setting the board's
                token to an invalid value and running a live suite directly --
                if it still reaches the account, it used the right one.
            - >-
                Never read a test token from the product.  The suites exercise
                the same code path a real run takes, so nothing in the board
                may know that a second token exists; the swap happens in the
                suite's own environment before the client is built.
            - >-
                Count throttle errors in a run and report them, so a quota
                failure is never read as a regression.  A live suite that
                failed early having passed alone minutes before is a throttle,
                not a bug.
            - >-
                Re-run a single live-suite failure before believing it.  These
                suites contend over one account, and several are known to fail
                once and pass clean immediately after.
            - >-
                Before calling any suite failure a regression, run that suite
                against a git worktree at HEAD.  Identical failures before and
                after mean pre-existing, and several suites here fail that way.
            - >-
                Freeze the product code for a verification run and confirm it
                with shasum afterwards.  A run spanning an edit proves nothing
                about either version.  Un-check any task whose verification
                predates a later edit to the code it verified.
            - >-
                The regression instrument is a capture of the board from a
                worktree at HEAD and one from the working tree, taken the same
                day minutes apart and compared key by key.  Lists that only
                gain entries are outside additions; a regression removes or
                reorders.
            - >-
                Refresh the day-guarded baseline before starting a change,
                never after.  A baseline taken afterwards agrees with whatever
                the change did, and one from another day silently compares two
                different days.
            - >-
                Live suites name the tasks they create with a zz- prefix and
                delete them in a finally.  Check the account for leaks after a
                run -- a crashed suite leaves tasks behind, and they surface
                later as a phantom regression in the counts.
            - >-
                Copy a fixture per run rather than reading the shipped one in
                place, as soon as the code under test can write to it.  A key
                that writes turned a read-only sample maildir into a writable
                one, and a suite rewrote the fixture every other suite measures
                against.
            - >-
                A suite comparing the board's rows to a store fetch must
                exclude rows from the other sources first.  The store was
                never asked about a calendar event, a tracker issue or a mail
                thread, so counting them makes the suite fail by exactly their
                number.
            - >-
                Report calendar and mailbox data as counts only.  Never print
                or commit a subject, sender, body, event title or folder name.
            - >-
                Anchor every scripted edit and assert the anchor is present
                before writing.  A silent no-op replace once left a refusal
                unimplemented while the parse check still passed, and the key
                went on performing a real write.
    archive:
        guidance:
            - >-
                Merge a spec delta on parsed requirement blocks, never by
                string offsets.  Computing an insertion point before removals
                shift the text corrupted this spec once, dropping one
                requirement and duplicating scenarios into another -- and
                validate passed on the corrupted file.
            - >-
                Before writing a merged spec, assert that splitting and
                rejoining the original is byte-identical, that no scenario was
                lost, and that every untouched requirement is unchanged.  That
                check caught a splitter quietly losing 3 of 104 requirements.
            - >-
                Stage explicitly with `git add -- '*.py' openspec tests`.
                Never `git add -A` -- the scratchpad, the captures and .env
                sit nearby.  `tests` is named because the pathspec `'*.py'`
                matches no maildir fixture file, so without it the mail
                suites land without the data they read and fail on a fresh
                clone.
            - >-
                Grep the staged diff for scrubbed identifiers, project keys and
                credentials before committing.  A real tracker key was removed
                from this history with filter-repo and must not return.
